<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Laravel, analytics, and AI workflow map</title>
  <desc id="desc">A clean system map showing workflow signals moving through Laravel architecture, data intelligence, and user-facing decision surfaces.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="rail" x1="124" y1="214" x2="1076" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D20"/>
      <stop offset="0.52" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-24%" width="136%" height="156%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#panel)" stroke="#263244" stroke-width="2"/>
  <path d="M130 216H1070" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="72" y="74" fill="#F8FAFC" font-size="24" font-weight="850">How I turn operations into software</text>
    <text x="72" y="104" fill="#94A3B8" font-size="16">A practical architecture loop: structure the domain, protect the data, surface decisions, then improve the workflow.</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="72" y="160" width="180" height="104" rx="20" fill="#111827" stroke="#FF2D20" stroke-opacity="0.72"/>
    <text x="162" y="196" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="800">Workflow</text>
    <text x="162" y="224" text-anchor="middle" fill="#94A3B8" font-size="13">requests, rules, pain</text>
    <text x="162" y="244" text-anchor="middle" fill="#94A3B8" font-size="13">manual process signals</text>

    <rect x="302" y="142" width="210" height="140" rx="22" fill="#101A2D" stroke="#FF2D20" stroke-opacity="0.52"/>
    <text x="407" y="176" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="800">Laravel Core</text>
    <text x="407" y="206" text-anchor="middle" fill="#CBD5E1" font-size="13">Eloquent models</text>
    <text x="407" y="228" text-anchor="middle" fill="#CBD5E1" font-size="13">policies, queues, APIs</text>
    <text x="407" y="250" text-anchor="middle" fill="#CBD5E1" font-size="13">Filament / Livewire UI</text>

    <rect x="562" y="142" width="210" height="140" rx="22" fill="#0E2434" stroke="#38BDF8" stroke-opacity="0.58"/>
    <text x="667" y="176" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="800">Data Layer</text>
    <text x="667" y="206" text-anchor="middle" fill="#CBD5E1" font-size="13">SQL and KPI models</text>
    <text x="667" y="228" text-anchor="middle" fill="#CBD5E1" font-size="13">BI dashboards</text>
    <text x="667" y="250" text-anchor="middle" fill="#CBD5E1" font-size="13">KNIME / Tableau / Power BI</text>

    <rect x="822" y="142" width="210" height="140" rx="22" fill="#0C2729" stroke="#14B8A6" stroke-opacity="0.62"/>
    <text x="927" y="176" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="800">AI Context</text>
    <text x="927" y="206" text-anchor="middle" fill="#CBD5E1" font-size="13">approved records</text>
    <text x="927" y="228" text-anchor="middle" fill="#CBD5E1" font-size="13">citations and actions</text>
    <text x="927" y="250" text-anchor="middle" fill="#CBD5E1" font-size="13">safe assistant behavior</text>

    <rect x="1050" y="160" width="120" height="104" rx="20" fill="#1E1A10" stroke="#F59E0B" stroke-opacity="0.7"/>
    <text x="1110" y="198" text-anchor="middle" fill="#F8FAFC" font-size="16" font-weight="800">Decision</text>
    <text x="1110" y="226" text-anchor="middle" fill="#FCD34D" font-size="13">clear, traceable</text>
    <text x="1110" y="246" text-anchor="middle" fill="#FCD34D" font-size="13">usable output</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M252 212H292"/>
    <path d="M292 212L282 204"/>
    <path d="M292 212L282 220"/>
    <path d="M512 212H552"/>
    <path d="M552 212L542 204"/>
    <path d="M552 212L542 220"/>
    <path d="M772 212H812"/>
    <path d="M812 212L802 204"/>
    <path d="M812 212L802 220"/>
    <path d="M1032 212H1042"/>
    <path d="M1042 212L1034 204"/>
    <path d="M1042 212L1034 220"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="750">
    <rect x="302" y="320" width="124" height="30" rx="15" fill="#FF2D20" fill-opacity="0.13"/>
    <text x="364" y="340" text-anchor="middle" fill="#FCA5A5">Laravel</text>
    <rect x="442" y="320" width="124" height="30" rx="15" fill="#38BDF8" fill-opacity="0.13"/>
    <text x="504" y="340" text-anchor="middle" fill="#BAE6FD">Analytics</text>
    <rect x="582" y="320" width="124" height="30" rx="15" fill="#14B8A6" fill-opacity="0.13"/>
    <text x="644" y="340" text-anchor="middle" fill="#99F6E4">AI context</text>
    <rect x="722" y="320" width="132" height="30" rx="15" fill="#F59E0B" fill-opacity="0.13"/>
    <text x="788" y="340" text-anchor="middle" fill="#FCD34D">Decision UX</text>
  </g>
</svg>
