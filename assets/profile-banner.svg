<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Baobaid profile banner</title>
  <desc id="desc">A minimal dark banner for Laravel, data, and AI workflow work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.62" stop-color="#111827"/>
      <stop offset="1" stop-color="#103B3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="210" y1="190" x2="990" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D20"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="28" fill="url(#grid)"/>
  <path d="M210 190H990" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="210" cy="190" r="6" fill="#FF2D20"/>
  <circle cx="600" cy="190" r="6" fill="#F59E0B"/>
  <circle cx="990" cy="190" r="6" fill="#14B8A6"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="78" fill="#FCA5A5" font-size="13" font-weight="850" letter-spacing="2">MBS047</text>
    <text x="600" y="128" fill="#F8FAFC" font-size="52" font-weight="850">Mohammed Baobaid</text>
    <text x="600" y="164" fill="#CBD5E1" font-size="21" font-weight="650">Laravel systems. Data products. AI workflows.</text>
    <text x="600" y="224" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="1.4">LARAVEL / FILAMENT / ANALYTICS / OPENAI</text>
  </g>
</svg>
