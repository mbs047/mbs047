<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Baobaid profile banner</title>
  <desc id="desc">A refined dark banner for Laravel systems, analytics, and AI-aware workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.58" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#092F2F"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="256" x2="1040" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D20"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <path d="M86 252C220 167 338 208 468 144C604 78 710 100 812 133C922 168 1017 122 1114 66" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M112 271C263 220 369 236 506 188C640 142 756 171 894 191C1001 206 1066 172 1132 136" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.14"/>

  <g filter="url(#shadow)">
    <rect x="76" y="66" width="586" height="188" rx="24" fill="#0B1220" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <rect x="104" y="94" width="118" height="30" rx="15" fill="#FF2D20" fill-opacity="0.14" stroke="#FF2D20" stroke-opacity="0.55"/>
    <text x="163" y="114" text-anchor="middle" fill="#FCA5A5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.4">MBS047</text>
    <text x="104" y="162" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="850">Mohammed Baobaid</text>
    <text x="106" y="198" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="650">Laravel systems. Data products. AI-aware workflows.</text>
    <text x="106" y="228" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Abu Dhabi based builder turning operations into clear software.</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="735" y="82" width="336" height="172" rx="24" fill="#0B1220" fill-opacity="0.78" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="770" y="123" fill="#E2E8F0" font-size="14" font-weight="800" letter-spacing="1.2">CURRENT SHAPE</text>
    <g font-size="15" font-weight="750">
      <circle cx="778" cy="154" r="5" fill="#FF2D20"/>
      <text x="796" y="160" fill="#F8FAFC">Laravel product architecture</text>
      <circle cx="778" cy="189" r="5" fill="#F59E0B"/>
      <text x="796" y="195" fill="#F8FAFC">Analytics and decision layers</text>
      <circle cx="778" cy="224" r="5" fill="#14B8A6"/>
      <text x="796" y="230" fill="#F8FAFC">Context-aware AI interfaces</text>
    </g>
  </g>
</svg>
