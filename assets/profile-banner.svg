<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Baobaid profile banner</title>
  <desc id="desc">A simple banner for Laravel systems, data products, and AI workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#0F3A3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="242" x2="1028" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D20"/>
      <stop offset="0.5" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="144%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="28" fill="url(#grid)"/>
  <path d="M92 240C228 172 354 202 492 150C626 99 748 108 880 128C978 143 1064 104 1132 64" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M112 258C266 216 394 226 526 186C674 141 804 172 930 183C1012 190 1075 168 1138 132" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.13"/>

  <g filter="url(#shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="78" y="64" width="1044" height="174" rx="24" fill="#0B1220" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="118" y="113" fill="#FCA5A5" font-size="13" font-weight="850" letter-spacing="1.6">MBS047</text>
    <text x="118" y="164" fill="#F8FAFC" font-size="48" font-weight="850">Mohammed Baobaid</text>
    <text x="120" y="202" fill="#CBD5E1" font-size="22" font-weight="650">Laravel systems • data products • AI workflows</text>

    <g font-size="15" font-weight="800">
      <rect x="768" y="92" width="220" height="34" rx="17" fill="#FF2D20" fill-opacity="0.13" stroke="#FF2D20" stroke-opacity="0.35"/>
      <text x="878" y="115" text-anchor="middle" fill="#FCA5A5">🧱 Laravel architecture</text>
      <rect x="768" y="141" width="220" height="34" rx="17" fill="#38BDF8" fill-opacity="0.13" stroke="#38BDF8" stroke-opacity="0.35"/>
      <text x="878" y="164" text-anchor="middle" fill="#BAE6FD">📊 Analytics clarity</text>
      <rect x="768" y="190" width="220" height="34" rx="17" fill="#14B8A6" fill-opacity="0.13" stroke="#14B8A6" stroke-opacity="0.35"/>
      <text x="878" y="213" text-anchor="middle" fill="#99F6E4">🤖 Useful AI context</text>
    </g>
  </g>
</svg>
