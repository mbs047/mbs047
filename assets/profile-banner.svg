<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mohammed Baobaid profile banner</title>
  <desc id="desc">A dark technical banner for Laravel systems, data analytics, and AI workflows.</desc>
  <defs>
