      <stop stop-color="#080B12"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B3B3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="40" x2="1040" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D20"/>
